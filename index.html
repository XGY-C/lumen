<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#fcfcfb" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#141518" media="(prefers-color-scheme: dark)" />
    <meta name="description" content="Lumen — 一个精致的本地 AI 对话界面" />
    <link rel="icon" type="image/svg+xml" href="/brand/lumen-favicon.svg" />
    <title>Lumen · AI Chat</title>
    <script>
      // 在首帧前定好主题，避免 React 挂载后闪白。
      // 与 src/lib/use-theme.ts 共用同一个 key。
      ;(function () {
        try {
          var stored = localStorage.getItem('lumen-theme')
          var dark =
            stored === 'dark' ||
            (stored !== 'light' &&
              window.matchMedia('(prefers-color-scheme: dark)').matches)
          document.documentElement.classList.toggle('dark', dark)
          document.documentElement.style.colorScheme = dark ? 'dark' : 'light'
        } catch (e) {
          /* localStorage 不可用时保持默认浅色 */
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
