      <rect width="48" height="48" fill="url(#lk-glow)"/>
    </g>
    <path fill="url(#lk-beam)" d="M13.1 9h5.8a1.2 1.2 0 0 1 1.2 1.2v17.2a3.4 3.4 0 0 0 3.4 3.4h11.4a1.2 1.2 0 0 1 1.2 1.2v5.8a1.2 1.2 0 0 1-1.2 1.2H13.7a1.8 1.8 0 0 1-1.8-1.8V10.2A1.2 1.2 0 0 1 13.1 9Z"/>
    <rect x=".5" y=".5" width="47" height="47" rx="13.9" fill="none" stroke="url(#lk-edge)"/>
