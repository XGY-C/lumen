<svg xmlns="http://www.w3.org/2000/svg" width="132" height="40" viewBox="0 0 132 40" fill="none" stroke="none" role="img" aria-labelledby="lk-title" color="#191C22">
  <title id="lk-title">Lumen</title>
  <defs>
    <linearGradient id="lk-body" x1="7" y1="3" x2="41" y2="45" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#4A7CE0"/>
      <stop offset="1" stop-color="#1E4DAA"/>
    </linearGradient>
    <radialGradient id="lk-glow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse"
      gradientTransform="translate(23 27) rotate(45) scale(22 18)">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity=".16"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="lk-beam" x1="19" y1="10" x2="36" y2="39" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#F0F5FF"/>
    </linearGradient>
    <linearGradient id="lk-edge" x1="24" y1="0" x2="24" y2="24" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity=".42"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="lk-clip"><rect width="48" height="48" rx="14.4"/></clipPath>
